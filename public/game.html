<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Server Panic — Game in progress. Manage servers and route traffic in real-time.">
  <title>Server Panic — Game</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="game-container" id="game-root">

  <!-- ── Top Bar ──────────────────────────────────────────────────────── -->
  <div class="top-bar">
    <div>
      <span class="team-name" id="g-team-name">Team</span>
      <span style="color:var(--text-dim); font-size:.8rem; margin-left:.5rem; font-family:var(--font-mono);" id="g-room-code"></span>
    </div>
    <span class="role-badge" id="g-role-badge">ROLE</span>
  </div>

  <!-- ── Progress ─────────────────────────────────────────────────────── -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Requests Processed</span>
      <span id="g-progress-text">0 / 500</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="g-progress-bar" style="width:0%"></div>
    </div>
  </div>

  <!-- ═══ TRAFFIC COP VIEW ════════════════════════════════════════════ -->
  <div id="view-traffic-cop" style="display:none;">
    <div class="traffic-section">
      <div class="queue-panel">
        <h3>📨 Incoming Traffic Queue</h3>
        <div id="tc-queue"></div>
      </div>
      <div class="route-panel">
        <h3>🎯 Route To</h3>
        <div id="tc-routes"></div>
        <p style="font-size:.75rem; color:var(--text-dim); font-family:var(--font-mono); margin-top:.5rem;">
          Click a server to send the top request there. You cannot see server health.
        </p>
      </div>
    </div>
  </div>

  <!-- ═══ MECHANIC VIEW ══════════════════════════════════════════════= -->
  <div id="view-mechanic" style="display:none;">
    <div class="mech-layout">
      <div class="servers-grid" id="mech-servers"></div>
      <div class="mech-actions">
        <h3>⚙️ Infrastructure</h3>
        <button class="action-btn" id="btn-add-server">
          ➕ Add Server
          <span class="cost">Costs 30 processed</span>
        </button>
        <div id="upgrade-btns"></div>
        <p style="font-size:.75rem; color:var(--text-dim); font-family:var(--font-mono); margin-top:.5rem;">
          You cannot see the incoming traffic queue.
        </p>
      </div>
    </div>
  </div>

</div>

<!-- ═══ GAME OVER OVERLAY ════════════════════════════════════════════ -->
<div class="game-over-overlay" id="game-over-overlay">
  <div class="game-over-title" id="go-title">VICTORY</div>
  <div class="game-over-sub" id="go-subtitle">You did it!</div>
  <div style="font-family:var(--font-mono); color:var(--text-dim); font-size:.9rem;" id="go-stats"></div>
  <button class="btn btn-primary btn-lg" onclick="window.location.href='/'">Return to Lobby</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
